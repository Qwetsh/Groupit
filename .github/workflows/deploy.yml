# Workflow pour déployer Groupit + PWA Jury + tableau de bord sur GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Workspaces npm : une seule installation pour l'application principale,
      # apps/jury, apps/dashboard et packages/shared (un seul package-lock.json).
      - name: Install dependencies
        run: npm ci

      # Contrôles : un échec ici arrête le job, donc le déploiement.
      # ESLint est lancé depuis la racine et couvre aussi apps/ et packages/.
      - name: Lint
        run: npm run lint

      - name: Typecheck (Groupit, jury, dashboard)
        run: |
          npm run typecheck
          npm run typecheck:apps

      - name: Tests
        run: npm run test:run

      - name: Build Groupit
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Build PWA Jury
        run: npm run build:jury
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Build Dashboard
        run: npm run build:dashboard
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # Combiner les builds
      - name: Combine builds
        run: |
          cp -r apps/jury/dist ./dist/groupit-jury
          cp -r apps/dashboard/dist ./dist/groupit-dashboard

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
