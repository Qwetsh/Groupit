<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Locanda</title>
    <script>
      // Thème clair/sombre posé avant le premier affichage (voir src/hooks/useTheme.ts)
      (function() {
        var theme;
        try { theme = localStorage.getItem('locanda-theme'); } catch (e) { theme = null; }
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // GitHub Pages SPA redirect handler
      (function() {
        const redirect = sessionStorage.getItem('spa-redirect');
        if (redirect) {
          sessionStorage.removeItem('spa-redirect');
          const base = '/Groupit';
          const path = redirect.startsWith(base) ? redirect.slice(base.length) : redirect;
          if (path && path !== '/') {
            window.history.replaceState(null, '', base + path);
          }
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
